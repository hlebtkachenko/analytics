services:
  caddy:
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:80'

  web:
    environment:
      BAP_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
    restart: on-failure

  api:
    environment:
      AUTH_RATE_LIMIT: ${BAP_API_RATE_LIMIT:-60}
      BAP_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
    restart: on-failure

  reporting-api:
    environment:
      AUTH_RATE_LIMIT: ${BAP_API_RATE_LIMIT:-60}
      BAP_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
    restart: on-failure

  worker:
    environment:
      BAP_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
    restart: on-failure

  database:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

networks:
  data:
    internal: false
