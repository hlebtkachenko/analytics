# freshclam for BAP: refreshes the shared signature volume twice an hour, logs to stdout.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Checks 12
# NotifyClamd is deliberately absent: clamd has no route from this service and reloads through SelfCheck.
