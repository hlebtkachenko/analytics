# clamd for the BAP worker: TCP only on the scan network, no log file, caps sized for one 25 MB email plus MIME overhead.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
# freshclam cannot reach clamd across networks, so the self check picks up new signatures.
SelfCheck 600
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 60M
MaxRecursion 10
MaxFiles 200
MaxScanTime 60000
AlertExceedsMax yes
