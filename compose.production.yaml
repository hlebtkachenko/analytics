services:
  caddy:
    environment:
      BAP_PUBLIC_HOST: ${BAP_PUBLIC_HOST:?Set BAP_PUBLIC_HOST}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    restart: unless-stopped

  web:
    environment:
      BAP_PUBLIC_ORIGIN: ${BAP_PUBLIC_ORIGIN:?Set BAP_PUBLIC_ORIGIN}
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0750

  api:
    environment:
      BAP_PUBLIC_ORIGIN: ${BAP_PUBLIC_ORIGIN:?Set BAP_PUBLIC_ORIGIN}
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

  reporting-api:
    environment:
      BAP_PUBLIC_ORIGIN: ${BAP_PUBLIC_ORIGIN:?Set BAP_PUBLIC_ORIGIN}
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

  database:
    restart: unless-stopped
