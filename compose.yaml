name: bap

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    networks:
      - application
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3001
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    networks:
      - application
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  reporting-api:
    build:
      context: .
      dockerfile: docker/reporting-api.Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3002
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    networks:
      - application
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bap}
      POSTGRES_PASSWORD:
        ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_USER: ${POSTGRES_USER:-bap}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql

networks:
  application: {}
  data:
    internal: true

volumes:
  postgres_data:
