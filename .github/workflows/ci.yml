name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  IBM_TELEMETRY_DISABLED: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  NO_UPDATE_NOTIFIER: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            script: format:check
          - name: lint
            script: lint
          - name: typecheck
            script: typecheck
          - name: test
            script: test
          - name: build
            script: build
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@24.20.0
          version: 11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        shell: bash
        env:
          RUN_NAME: ${{ matrix.name }}
          RUN_SCRIPT: ${{ matrix.script }}
        run: |
          started_at=$(date +%s)
          pnpm "$RUN_SCRIPT"
          elapsed_seconds=$(($(date +%s) - started_at))
          printf '### %s\n\n- Duration: %ss\n' "$RUN_NAME" "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      POSTGRES_PASSWORD: ci-only-compose-value
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate development configuration
        run:
          docker compose -f compose.yaml -f compose.development.yaml config
          --quiet

      - name: Validate production configuration
        run:
          docker compose -f compose.yaml -f compose.production.yaml config
          --quiet

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_PORT: '39101'
      POSTGRES_PASSWORD: ci-only-container-value
      POSTGRES_PORT: '39432'
      REPORTING_API_PORT: '39102'
      WEB_PORT: '39100'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start stack
        id: stack
        shell: bash
        run: |
          started_at=$(date +%s)
          docker compose -f compose.yaml -f compose.development.yaml up --build --detach --wait --wait-timeout 60
          curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/health"
          curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/health"
          curl --fail --silent --show-error "http://127.0.0.1:${REPORTING_API_PORT}/health"
          elapsed_seconds=$(($(date +%s) - started_at))
          printf '### Container smoke\n\n- Duration: %ss\n' "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Show failure logs
        if: failure() && steps.stack.outcome == 'failure'
        run:
          docker compose -f compose.yaml -f compose.development.yaml logs
          --no-color

      - name: Stop stack
        if: always()
        run:
          docker compose -f compose.yaml -f compose.development.yaml down
          --volumes
