version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - '*'
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
    # eslint 10 and typescript 6.1 fall outside peers that eslint-config-next and typescript-eslint declare.
    # strictPeerDependencies makes that a hard install failure until upstream widens its ranges.
    # typescript also blocks minors, because the bound is <6.1.0, which is a minor boundary and not a major one.
    # Version updates only: security updates are unaffected, and patches still open pull requests.
    ignore:
      - dependency-name: '@eslint/js'
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
