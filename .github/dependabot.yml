version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - '*'
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
    # eslint 10 and typescript 7 fall outside peers that eslint-config-next and typescript-eslint still declare.
    # strictPeerDependencies makes that a hard install failure, so these majors cannot land until upstream widens.
    # Version updates only: security updates and every patch and minor release are unaffected.
    ignore:
      - dependency-name: '@eslint/js'
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
